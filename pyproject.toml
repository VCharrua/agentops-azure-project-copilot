[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "project-delivery-copilot"
version = "0.1.0"
description = "Project Delivery Copilot: an Azure AI agent reference implementation with full CI/CD, evaluation gates and human-in-the-loop approvals. Synthetic data only."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Only needed when COPILOT_MODE=azure. Local mode and the test suite run without Azure credentials.
azure = [
  "azure-ai-projects>=2.3,<3",
  "azure-identity>=1.19,<2",
  "azure-search-documents>=12,<13",
  "azure-ai-contentsafety>=1,<2",
  "azure-monitor-opentelemetry>=1.8,<2",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.13,<3",
  "types-PyYAML>=6,<7",
  "pip-audit>=2.7,<3",
]

[project.scripts]
copilot-evals = "copilot.evals.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S", "PT", "RUF", "N", "T20"]
ignore = [
  "S101", # assert is the pytest idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"scripts/**" = ["T20"]
"scripts/generate_synthetic_data.py" = ["T20", "E501"] # long prose paragraphs
"src/copilot/evals/runner.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "evals: golden-dataset evaluation run (also executed by the agent-evals workflow)",
]

[tool.coverage.run]
source = ["copilot"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
